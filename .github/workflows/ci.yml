name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/graphrag
          key: graphrag-pypi-top500
      - run: pip install -e '.[dev]'
      - run: pytest -q
      # graph and vector retrieval on questions that need hops
      - run: python -m graphrag bench
