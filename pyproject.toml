[project]
name = "graph-rag"
version = "0.1.0"
description = "Knowledge-graph and vector retrieval over the same chunks, routed, for questions that need hops"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy==2.4.6", "onnxruntime==1.30.0", "tokenizers==0.23.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["graphrag"]
